name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip ios-project.zip -d project

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods
        run: |
          cd project
          pod install

      - name: Build and archive
        run: |
          cd project
          xcodebuild -workspace "警报器.xcworkspace" \
            -scheme "警报器" \
            -configuration Release \
            -archivePath build/警报器.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Export IPA
        run: |
          cd project
          mkdir -p build/Payload
          cp -r build/警报器.xcarchive/Products/Applications/警报器.app build/Payload/
          cd build
          zip -r 警报器.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: siren-ipa
          path: project/build/警报器.ipa
