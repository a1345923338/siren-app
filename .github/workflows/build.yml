name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip ios-project-en.zip -d project

      - name: Remove BOM from files
        run: |
          find project -type f \( -name "*.pbxproj" -o -name "Podfile" -o -name "*.xcscheme" -o -name "*.plist" \) -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods
        run: |
          cd project
          pod install

      - name: Build and archive
        run: |
          cd project
          xcodebuild -workspace "Siren.xcworkspace" \
            -scheme "Siren" \
            -configuration Release \
            -archivePath build/Siren.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Export IPA
        run: |
          cd project
          xcodebuild -exportArchive \
            -archivePath build/Siren.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Siren-IPA
          path: project/build/ipa/*.ipa
